<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  
  <title id="pageTitle">404 — Página No Encontrada · Origgo</title>
  <meta name="description" content="El recurso o enlace solicitado no está disponible en la terminal de Origgo.">
  <link rel="canonical" href="https://origgo.online/404">

  <!-- Identidad de Marca y Favicon Oficial -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  
  <!-- CDNs de Fuentes e Iconos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-main: #0A110E;
      --bg-card: hsla(170, 40%, 8%, 0.95);
      --accent-emerald: #0a9f68;
      --text-main: #FFFFFF;
      --text-muted: #8EB69B;
      --text-dim: #4B6358;
      --border-subtle: hsla(129, 48%, 87%, 0.12);
      --border-focus: hsla(158, 64%, 52%, 0.35);
      --radius-card: 28px;
      --radius-btn: 16px;
      --radius-pill: 9999px;
    }

    [data-theme="light"] {
      --bg-main: #E4EEE7;
      --bg-card: #FFFFFF;
      --accent-emerald: #047857;
      --text-main: #0A110E;
      --text-muted: #2E3B35;
      --text-dim: #54655D;
      --border-subtle: hsla(166, 40%, 23%, 0.16);
      --border-focus: hsla(166, 40%, 23%, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .not-found-card {
      position: relative;
      z-index: 1;
      max-width: 540px;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      padding: 2.75rem 2.25rem 2.25rem;
      text-align: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.45);
    }

    .card-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .brand-logo-link {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .brand-logo-link:hover {
      opacity: 0.85;
    }

    .brand-logo-link img {
      height: 32px;
      width: auto;
      display: block;
    }

    /* Selector Minimalista Bilingüe */
    .lang-switch-box {
      display: inline-flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      padding: 2px 4px;
    }

    .btn-lang {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      transition: all 0.2s ease;
    }

    .btn-lang.active {
      background: var(--accent-emerald);
      color: #FFFFFF;
    }

    /* Caja de Icono Táctico estilo Desmulta */
    .error-icon-box {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem;
      background: rgba(10, 159, 104, 0.08);
      border: 1px solid var(--border-focus);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: var(--accent-emerald);
    }

    /* Número 404 Monumental y Tipografía de Autor */
    .error-code {
      font-size: 6rem;
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.05em;
      color: var(--text-main);
      margin-bottom: 0.75rem;
      text-transform: uppercase;
    }

    .error-title {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin-bottom: 0.85rem;
      color: var(--text-main);
      text-transform: uppercase;
    }

    .error-title .accent-italic {
      color: var(--accent-emerald);
      font-style: italic;
    }

    .error-desc {
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 2.25rem;
      font-weight: 500;
    }

    /* Botón Principal Sólido sin Neones */
    .actions-cluster {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      justify-content: center;
    }

    .btn-return-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      width: 100%;
      height: 52px;
      background: var(--accent-emerald);
      color: #041B12 !important;
      font-size: 0.88rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: var(--radius-btn);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: transform 0.15s ease, background-color 0.2s ease;
      cursor: pointer;
    }

    .btn-return-home:hover {
      background-color: #058656;
      transform: translateY(-1px);
    }

    .btn-return-home:active {
      transform: scale(0.98);
    }

    /* Sello Técnico de Auditoría estilo Desmulta (Sin Soporte Humano / Cero WhatsApp) */
    .audit-signature {
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      opacity: 0.45;
    }
  </style>
</head>
<body>
  <main class="not-found-card">
    <div class="card-top-bar">
      <a href="/" class="brand-logo-link" title="Origgo">
        <img src="./assets/img/origgo-icon.svg" alt="Origgo" width="32" height="32" />
      </a>
      <div class="lang-switch-box" role="group" aria-label="Selector de Idioma">
        <button type="button" class="btn-lang active" id="btnLangEs" onclick="setLang('es')">ES</button>
        <button type="button" class="btn-lang" id="btnLangEn" onclick="setLang('en')">EN</button>
      </div>
    </div>

    <!-- Icono Táctico de Búsqueda -->
    <div class="error-icon-box" aria-hidden="true">
      <i class="fa-solid fa-file-circle-question"></i>
    </div>

    <!-- Número 404 Monumental -->
    <h1 class="error-code">404</h1>

    <!-- Subtítulo de Estatus -->
    <h2 class="error-title" id="txtErrorTitle">
      Página No <span class="accent-italic">Encontrada</span>
    </h2>

    <!-- Explicación Clara y Profesional -->
    <p class="error-desc" id="txtErrorDesc">
      Lo sentimos, el recurso, oportunidad o sección que buscas no está disponible en esta dirección. Es posible que haya sido retirada del ledger de transacciones directas o que el enlace haya expirado.
    </p>

    <!-- Acción Inmediata al Inicio -->
    <div class="actions-cluster">
      <a href="/" class="btn-return-home">
        <i class="fa-solid fa-house"></i>
        <span id="txtBtnReturn">IR AL INICIO</span>
      </a>
    </div>

    <!-- Sello Técnico Silencioso (Cero Carga de Soporte Manual) -->
    <div class="audit-signature">
      <i class="fa-solid fa-shield-halved"></i>
      <span id="txtAuditSignature">Origgo v1.0.0 — Búsqueda Segura Finalizada</span>
    </div>
  </main>

  <script>
    const I18N_404 = {
      es: {
        pageTitle: '404 — Página No Encontrada · Origgo',
        title: 'Página No <span class="accent-italic">Encontrada</span>',
        desc: 'Lo sentimos, el recurso, oportunidad o sección que buscas no está disponible en esta dirección. Es posible que haya sido retirada del ledger de transacciones directas o que el enlace haya expirado.',
        btnReturn: 'IR AL INICIO',
        signature: 'Origgo v1.0.0 — Búsqueda Segura Finalizada'
      },
      en: {
        pageTitle: '404 — Page Not Found · Origgo',
        title: 'Page Not <span class="accent-italic">Found</span>',
        desc: 'Sorry, the property record, opportunity, or section you are looking for is not available at this address. It may have been archived from the direct ledger or the link has expired.',
        btnReturn: 'RETURN TO CATALOG',
        signature: 'Origgo v1.0.0 — Secure Lookup Finished'
      }
    };

    function setLang(lang) {
      try { localStorage.setItem('origgo_lang', lang); } catch (e) {}
      const data = I18N_404[lang] || I18N_404.es;
      document.title = data.pageTitle;
      document.getElementById('txtErrorTitle').innerHTML = data.title;
      document.getElementById('txtErrorDesc').textContent = data.desc;
      document.getElementById('txtBtnReturn').textContent = data.btnReturn;
      document.getElementById('txtAuditSignature').textContent = data.signature;
      document.getElementById('btnLangEs').classList.toggle('active', lang === 'es');
      document.getElementById('btnLangEn').classList.toggle('active', lang === 'en');
      document.documentElement.lang = lang;
    }

    // Inicialización automática de tema e idioma sin parpadeos
    (function init() {
      let savedTheme = 'dark';
      try { savedTheme = localStorage.getItem('origgo_theme') || 'dark'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', savedTheme);

      let savedLang = 'es';
      try {
        savedLang = localStorage.getItem('origgo_lang') || (navigator.language && navigator.language.startsWith('en') ? 'en' : 'es');
      } catch (e) {}
      setLang(savedLang);
    })();
  </script>
</body>
</html>
